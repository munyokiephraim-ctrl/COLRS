
name: COLRS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint HTML templates
        run: npx --yes htmlhint "app/templates/**/*.html"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install djLint
        run: python -m pip install djlint

      - name: Test - Validate Jinja HTML templates
        run: djlint app/templates --lint --profile=jinja

      - name: Check Python syntax
        run: python -m compileall -q app

      - name: Build distribution
        run: |
          mkdir -p dist
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='instance' \
            --exclude='.env' \
            ./ dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: colrs-site
          path: dist/
          if-no-files-found: error
          retention-days: 7
